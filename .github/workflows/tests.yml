name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Zentrale
        working-directory: server/zentrale
        run: |
          pip install -r requirements.txt pytest
          python -m pytest -q

      - name: Baustein
        working-directory: baustein
        run: python -m pytest -q

      - name: Installationsskript
        run: shellcheck -S warning server/install.sh
